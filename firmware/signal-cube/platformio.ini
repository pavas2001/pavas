; Pixberry Signal Cube firmware
;   Build and flash:   pio run -e esp32c3 -t upload
;   Serial console:    pio device monitor -e esp32c3
;   Logic tests (PC):  pio test -e native

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit LIS3DH@1.3.0
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.2.1
test_ignore = test_logic

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_compat_mode = off
