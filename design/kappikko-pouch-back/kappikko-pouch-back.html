    <text x="650" y="456">slow roasted in small batches to bring out a deep aroma and a full,</text>
    <text x="650" y="488">rich body. Freshly ground and packed to lock in flavour &#8212; nothing</text>
    <text x="650" y="520">added, nothing taken away. From our own coffee plants to your cup.</text>
  </g>

  <!-- left column: product type -->
